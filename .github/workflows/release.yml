# Builds GradApp for Windows, macOS and Linux.
#
#   Push a tag like v1.0.0  -> builds all three and publishes a GitHub release.
#   Any push or pull request -> checks and a Linux smoke test, no release.
#   Actions tab -> "Run workflow" -> builds all three as downloadable artifacts.
#
# The website (website/) is deployed by Vercel, not by this workflow.
#
# The website links to releases/latest/download/<fixed file name>, so a new
# tag is all it takes to update every download button.

name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run check
      - name: Smoke test (renders the window and exits)
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libnss3 libxss1 libasound2t64
          GRADAPP_SMOKE=1 GRADAPP_HOME="$RUNNER_TEMP/gradapp" xvfb-run -a npx electron . --no-sandbox | tee smoke.log
          grep -q "SMOKE ok" smoke.log

  build:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: Build
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned until certificates are added as secrets (CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, ...).
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            npx electron-builder ${{ matrix.target }} --publish always
          else
            npx electron-builder ${{ matrix.target }} --publish never
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: gradapp-${{ runner.os }}
          path: |
            desktop/dist/GradApp-*
            desktop/dist/latest*.yml
          if-no-files-found: error
